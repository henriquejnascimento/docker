services:
  nifi:
    image: apache/nifi:2.10.0
    container_name: nifi
    restart: unless-stopped

    ports:
      - "8443:8443"

    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      NIFI_WEB_HTTPS_HOST: "0.0.0.0"

      # Use senha forte, com no mínimo 12 caracteres
      SINGLE_USER_CREDENTIALS_USERNAME: "admin"
      SINGLE_USER_CREDENTIALS_PASSWORD: "admin"

      # Memória da JVM
      NIFI_JVM_HEAP_INIT: "1g"
      NIFI_JVM_HEAP_MAX: "2g"

      # Ajuda quando acessa pelo navegador via localhost
      NIFI_WEB_PROXY_HOST: "localhost:8443,127.0.0.1:8443"

    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_data:/opt/nifi/nifi-current/data
      - nifi_logs:/opt/nifi/nifi-current/logs
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_db:/opt/nifi/nifi-current/database_repository

    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:8443/nifi/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

volumes:
  nifi_conf:
  nifi_data:
  nifi_logs:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
  nifi_state:
  nifi_db: