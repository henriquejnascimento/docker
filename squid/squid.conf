# Squid Proxy Configuration
http_port 3128

# Block port 8090
acl blocked_ports port 8090
http_access deny blocked_ports

# Block the domain www.test.com
acl blocked_sites dstdomain .test.com
http_access deny blocked_sites

# Allow traffic to other sites
http_access allow all

# Define the operation mode
http_access deny all

# Log
access_log /var/log/squid/access.log

