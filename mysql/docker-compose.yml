services:
  mysql:
    image: mysql:9.5.0
    container_name: mysql
    restart: always
    environment:
      - MYSQL_DATABASE=myapp_db
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    ports:
      - '3306:3306'
    volumes:
      - mysql-volume:/var/lib/mysql
volumes:
  mysql-volume:
    driver: local