# Define the global settings
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Enable logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Basic settings for HTTP
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Server configuration for the reverse proxy
    server {
        listen 80;

        # Block multiple ports (8090, 8080, 3000, 5000)
        if ($server_port ~* "^(8090|8080|3000|5000)$") {
            return 403;  # Returns a 403 error if the request is made to any of the blocked ports
        }

        # Block multiple domains (www.dummy.com, www.test1.com, www.test2.com)
        if ($host ~* "^(www.dummy.com|www.test1.com|www.test2.com)$") {
            return 403;  # Returns a 403 error if the request is made to any of the blocked domains
        }

        # Define the reverse proxy backend (Squid Proxy)
        # NGINX forwards requests to the Squid Proxy listening on port 3128.
        # If Squid is running on a different server, replace "localhost" with the IP address or hostname of the Squid server.
        location / {
            proxy_pass http://localhost:3128;  # Forwards the requests to the Squid server on port 3128
            proxy_set_header Host $host;  # Passes the original Host header to the Squid
            proxy_set_header X-Real-IP $remote_addr;  # Passes the real IP address of the client
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Adds headers to track the client’s path
            proxy_set_header X-Forwarded-Proto $scheme;  # Passes the protocol (HTTP or HTTPS)
        }
    }
}
