services:
  angular:
    image: node:24.13.1
    container_name: angular-app
    working_dir: /app/hello-world
    volumes:
      - ./app:/app
    ports:
      - "4200:4200"
    command: sh -c "npm install -g @angular/cli && npm install && ng serve --host 0.0.0.0 --disable-host-check"
    networks:
      - angular-network

networks:
  angular-network:
    driver: bridge
